<template>
  <lightning-card title="Sample Conversations" icon-name="standard:live_chat">
    <lightning-button-icon
      slot="actions"
      data-id="import-json"
      icon-name="utility:paste"
      alternative-text="Import JSON"
      title="Paste sample conversation JSON"
      disabled={actionsDisabled}
      onclick={handleImportClick}
    ></lightning-button-icon>
    <lightning-button-icon
      slot="actions"
      data-id="download-json"
      icon-name="utility:download"
      alternative-text="Download JSON"
      title="Download conversations as JSON"
      disabled={actionsDisabled}
      onclick={handleDownloadClick}
    ></lightning-button-icon>
    <lightning-button-icon
      slot="actions"
      icon-name="utility:refresh"
      alternative-text="Reload"
      title="Reload list"
      disabled={actionsDisabled}
      onclick={handleRefresh}
    ></lightning-button-icon>

    <a
      class="slds-hide"
      href="#"
      data-id="download-file"
      download="sample-conversations.json"
    ></a>

    <div class="slds-p-horizontal_small slds-p-bottom_small">
      <template lwc:if={showSpinner}>
        <lightning-spinner
          alternative-text={spinnerLabel}
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <div class="slds-text-color_error slds-p-vertical_x-small" role="alert">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={hasRows}>
        <div class="layout">
          <!-- Left: skills as a vertical list -->
          <aside class="layout__skills">
            <p class="slds-text-title_caps slds-m-bottom_xx-small">Skills</p>
            <ul class="skill-list" role="list" aria-label="Skills">
              <template for:each={skillList} for:item="skill">
                <li key={skill.value} role="listitem">
                  <button
                    type="button"
                    class={skill.cardClass}
                    data-skill={skill.value}
                    aria-pressed={skill.isSelected}
                    disabled={actionsDisabled}
                    onclick={handleSelectSkill}
                  >
                    <span class="skill-card__name">{skill.name}</span>
                    <span class="skill-card__count">{skill.count}</span>
                  </button>
                </li>
              </template>
            </ul>
          </aside>

          <!-- Right: conversations for the selected skill, then the player -->
          <div class="layout__main">
            <p class="slds-text-title_caps slds-m-bottom_xx-small">
              Conversations
            </p>
            <ul
              class="conv-list"
              role="tablist"
              aria-label="Conversations for the selected skill"
            >
              <template for:each={conversationList} for:item="item">
                <li key={item.id} class={item.itemClass} role="presentation">
                  <button
                    type="button"
                    role="tab"
                    class="conv-list__button"
                    data-id={item.id}
                    aria-selected={item.isSelected}
                    disabled={actionsDisabled}
                    onclick={handleSelectConversation}
                  >
                    <span class="conv-list__name">{item.name}</span>
                    <template lwc:if={item.metaLabel}>
                      <span
                        class="conv-list__meta slds-text-body_small slds-text-color_weak"
                        >{item.metaLabel}</span
                      >
                    </template>
                  </button>
                </li>
              </template>
            </ul>

            <!-- Selected conversation (keyed so it remounts on change) -->
            <div class="conv-detail-wrap slds-m-top_small">
              <template lwc:if={showDetail}>
                <template for:each={detailItems} for:item="detail">
                  <div key={detail.key} class="conv-detail">
                    <div class="conv-detail__head">
                      <div class="conv-detail__title">
                        <h2 class="slds-text-heading_small">{detail.name}</h2>
                        <template lwc:if={detail.description}>
                          <p class="slds-text-body_small slds-text-color_weak">
                            {detail.description}
                          </p>
                        </template>
                        <template lwc:if={detail.lastPlayedLabel}>
                          <p
                            class="slds-text-body_small slds-text-color_weak conv-detail__lastplayed"
                          >
                            <lightning-icon
                              icon-name="utility:clock"
                              size="xx-small"
                              alternative-text="Last played"
                            ></lightning-icon>
                            {detail.lastPlayedLabel}
                          </p>
                        </template>
                      </div>
                      <div class="slds-button-group" role="group">
                        <lightning-button
                          data-id="detail-play"
                          label="Replay"
                          icon-name="utility:refresh"
                          variant="brand"
                          disabled={detailPlayDisabled}
                          onclick={handlePlayDetail}
                        ></lightning-button>
                        <lightning-button
                          label="Open"
                          title="Open the conversation record"
                          icon-name="utility:open"
                          onclick={handleOpenRecord}
                        ></lightning-button>
                      </div>
                    </div>

                    <template lwc:if={isPlaying}>
                      <div
                        class="slds-p-bottom_x-small slds-text-body_small slds-text-color_weak"
                        role="status"
                      >
                        Replaying live — responses stream in as the agent
                        answers, then the transcript and duration are saved.
                      </div>
                    </template>
                    <c-agentforce-chat
                      agent-api-name={detail.agent}
                      seeded-messages={detail.seedMessages}
                      markdown-enabled
                      show-avatar
                      max-height="32rem"
                      onmessage={handleDetailChatMessage}
                    ></c-agentforce-chat>
                  </div>
                </template>
              </template>
              <template lwc:else>
                <div class="conv-detail conv-detail_empty slds-text-color_weak">
                  Pick a conversation above to open it here.
                </div>
              </template>
            </div>
          </div>
        </div>

        <p class="slds-text-body_small slds-text-color_weak slds-p-top_x-small">
          Pick a skill on the left to list its sample conversations; the first
          one opens automatically and shows the saved transcript. "Replay
          against agent" runs it live and saves the fresh transcript and
          duration back to the record.
        </p>
      </template>

      <template lwc:if={showEmptyState}>
        <p class="slds-text-color_weak">
          No sample conversations found. Use Import JSON to paste a
          <code>records</code> payload.
        </p>
      </template>
    </div>
  </lightning-card>

  <template lwc:if={isImportModalOpen}>
    <section
      role="dialog"
      tabindex="-1"
      aria-modal="true"
      aria-labelledby="import-json-heading"
      class="slds-modal slds-fade-in-open slds-modal_medium"
      onkeydown={handleImportModalKeydown}
    >
      <div class="slds-modal__container">
        <lightning-button-icon
          class="slds-modal__close"
          icon-name="utility:close"
          alternative-text="Close"
          title="Close"
          variant="bare-inverse"
          disabled={isImporting}
          onclick={handleImportModalCancel}
        ></lightning-button-icon>
        <header class="slds-modal__header">
          <h2
            id="import-json-heading"
            class="slds-modal__title slds-hyphenate"
          >
            Import sample conversations
          </h2>
          <p class="slds-m-top_x-small slds-text-body_small slds-text-color_weak">
            Paste a sample-data JSON tree with a <code>records</code> array, or
            an array of Sample Conversation records.
          </p>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
          <lightning-textarea
            data-id="import-json-text"
            class="import-json-field"
            label="JSON"
            placeholder={importPlaceholder}
            value={importJsonDraft}
            disabled={isImporting}
            onchange={handleImportJsonChange}
          ></lightning-textarea>
          <template lwc:if={importModalError}>
            <div
              class="slds-text-color_error slds-m-top_x-small"
              role="alert"
            >
              {importModalError}
            </div>
          </template>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button
            label="Cancel"
            disabled={isImporting}
            onclick={handleImportModalCancel}
          ></lightning-button>
          <lightning-button
            class="slds-m-left_x-small"
            data-id="import-json-submit"
            variant="brand"
            label="Import"
            disabled={importSubmitDisabled}
            onclick={handleImportModalSubmit}
          ></lightning-button>
        </footer>
      </div>
    </section>
    <div
      class="slds-backdrop slds-backdrop_open"
      onclick={handleImportModalCancel}
    ></div>
  </template>
</template>
